<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SGI demos — redirecting…</title>
    <script>
      // Handle unresolved paths:
      // 1. Forward old demo links to the current page for that demo:
      //    …/sgi-demos/<demo>/web/…        (pre-demos/ layout)
      //    …/sgi-demos/demos/<demo>/web/…  (renamed demo, e.g. flight → flight-1988)
      //    both go to …/sgi-demos/demos/<current name>/web/
      // 2. All other unresolved paths get the 404 message below
      (function () {
        var renamed = { "flight": "flight-1988" };
        var m = location.pathname.match(/^\/sgi-demos\/(?:demos\/)?([^/]+)\/web\/[^/]*$/);
        if (!m) return;
        var demo = renamed[m[1]] || m[1];
        var target = "/sgi-demos/demos/" + demo + "/web/";
        if (target !== location.pathname) location.replace(target + location.search + location.hash);
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; background:#111; color:#ddd; padding:2rem;">
    <!-- Absolute path: this page is served at whatever URL missed, so a relative src would miss too -->
    <img src="/sgi-demos/media/404.png" alt="Plane crashing in the swamp" width="640">
    <h1>You crashed into the swamps</h1>
    <p>Try the <a href="https://sgi-demos.github.io">SGI demos home page</a></p>
  </body>
</html>
