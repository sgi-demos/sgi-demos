<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Gview</title>
        <style>
            .fullwindow {
                position: absolute;
                top: 0px;
                left: 0px;
                margin: 0px;
                border: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: block;
            }
        </style>
    </head>
    <body style="background-color: #000000;">
        <canvas class = "fullwindow" id="canvas" oncontextmenu="event.preventDefault()"/>
        <script type="text/javascript">
            var Module = {};
            Module.canvas = document.getElementById('canvas');
            // Turntable viewer by default (static until the mouse moves);
            // add ?fly for the fly-through mode SGI's menu launched.
            var params = new URLSearchParams(window.location.search);
            var args = [];
            if (params.get('fly') !== null) args.push('-f');
            var model = params.get('arg');
            args.push(model && /^[A-Za-z0-9_.-]+$/.test(model) ? model : 'Barcelona.gfo');
            Module.arguments = args;
        </script>
        <script async type="text/javascript" src="./gview.js"></script>
    </body>
</html>
