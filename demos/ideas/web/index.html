        <title>Ideas in Motion</title>
        <style>
            .fullwindow {
                position: absolute;
                top: 0px;
                left: 0px;
                margin: 0px;
                border: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: block;

        </style>

    <body style="background-color: #000000;">
        <canvas class = "fullwindow" id="canvas" oncontextmenu="event.preventDefault()"/>
        <script type="text/javascript">
            var Module = {};
            Module.canvas = document.getElementById('canvas');
            // The command line, from placard.json: web_flags maps a URL switch to
            // a flag (?fly adds -f), and web_arg is the default for ?arg=, the
            // argument buttonfly passes when it launches a demo.
            var FLAGS = {}, ARG = null;
            var params = new URLSearchParams(window.location.search);
            var args = [];
            Object.keys(FLAGS).forEach(function (k) { if (params.has(k)) args.push(FLAGS[k]); });
            if (ARG !== null) {
                var arg = params.get('arg');
                args.push(arg && /^[A-Za-z0-9_.-]+$/.test(arg) ? arg : ARG);
            }
            Module.arguments = args;
        </script>
        <script src="../../switches.js"></script>
        <script async type="text/javascript" src="./ideas.js"></script>
        <script defer src="../../placard.js" data-demo="ideas"></script>
